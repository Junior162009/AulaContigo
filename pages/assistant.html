<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>AulaContigo — Tutor IA</title>
<link rel="stylesheet" href="../css/style.css">
<style>
:root{--blue:#4f46e5;--cyan:#06b6d4;--ink:#111827;--muted:#64748b;--glass:rgba(255,255,255,.82)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#eef2ff}
.bot-page{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.bot-page:before,.bot-page:after{content:"";position:fixed;border-radius:50%;filter:blur(5px);z-index:-1}
.bot-page:before{width:420px;height:420px;background:#818cf855;top:-150px;left:-120px}
.bot-page:after{width:500px;height:500px;background:#22d3ee38;right:-180px;bottom:-220px}
.bot-header{height:76px;padding:0 clamp(16px,5vw,55px);display:flex;align-items:center;justify-content:space-between;color:white;background:linear-gradient(110deg,#111827,#312e81 55%,#0e7490);box-shadow:0 8px 30px #11182730;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:12px}.logo{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#fff,#c7d2fe);font-size:25px;box-shadow:0 5px 18px #0003}.brand-title{font-size:20px;font-weight:850;letter-spacing:-.3px}.brand-sub{font-size:11px;opacity:.7;margin-top:1px}
.clear{border:1px solid #ffffff35;background:#ffffff12;color:#fff;border-radius:12px;padding:9px 13px;font-weight:700;cursor:pointer;transition:.2s}.clear:hover{background:#ffffff25;transform:translateY(-1px)}
.bot-main{width:min(1120px,94%);margin:25px auto;flex:1;display:flex}
.bot-card{width:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid #fff;background:var(--glass);backdrop-filter:blur(18px);border-radius:28px;box-shadow:0 25px 70px #312e8130}
.bot-intro{padding:30px 32px 24px;background:linear-gradient(135deg,#ffffffdd,#eef2ffcc);border-bottom:1px solid #cbd5e155}
.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;background:#4f46e512;color:#4338ca;font-size:12px;font-weight:800;margin-bottom:10px}
.bot-intro h1{margin:0 0 8px;font-size:clamp(27px,4vw,38px);letter-spacing:-1.2px}.bot-intro p{margin:0;color:var(--muted);font-size:15px}
.messages{flex:1;min-height:50vh;max-height:60vh;overflow:auto;padding:25px clamp(15px,4vw,34px);scroll-behavior:smooth}
.msg{max-width:min(78%,750px);padding:14px 17px;border-radius:20px;margin:12px 0;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 6px 18px #1e293b0c;animation:pop .18s ease-out}
.msg.user{margin-left:auto;color:#fff;background:linear-gradient(135deg,#4f46e5,#2563eb);border-bottom-right-radius:6px}
.msg.assistant{background:#fff;color:#1e293b;border:1px solid #e2e8f0;border-bottom-left-radius:6px}
.typing{opacity:.7}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.suggestions{display:flex;gap:9px;flex-wrap:wrap;padding:0 25px 14px}
.suggestions button{border:1px solid #cbd5e1;background:#ffffffcc;color:#334155;border-radius:999px;padding:9px 13px;font-weight:650;cursor:pointer;transition:.18s}.suggestions button:hover{border-color:#818cf8;background:#eef2ff;transform:translateY(-2px);box-shadow:0 6px 15px #4f46e51a}
.status{padding:0 27px 10px;color:#64748b;font-size:12px}.status.ok{color:#15803d}.status.err{color:#b91c1c}
.composer{display:flex;gap:10px;padding:15px;background:#ffffffd9;border-top:1px solid #cbd5e155}
.composer textarea{flex:1;min-height:50px;max-height:150px;border:1px solid #cbd5e1;border-radius:17px;padding:14px 16px;resize:none;font:inherit;outline:none;background:#fff;transition:.2s}.composer textarea:focus{border-color:#6366f1;box-shadow:0 0 0 4px #6366f120}
.send{border:0;border-radius:17px;padding:0 23px;min-width:95px;background:linear-gradient(135deg,#4f46e5,#2563eb);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 20px #4f46e540;transition:.18s}.send:hover{transform:translateY(-1px;)}.send:disabled{opacity:.55;cursor:not-allowed;transform:none}
@media(max-width:650px){.bot-header{height:68px;padding:0 13px}.brand-title{font-size:17px}.logo{width:40px;height:40px}.brand-sub{display:none}.clear{font-size:11px;padding:8px}.bot-main{width:100%;margin:0}.bot-card{border-radius:0;border-left:0;border-right:0}.bot-intro{padding:24px 18px 20px}.bot-intro h1{font-size:26px}.messages{min-height:57vh;padding:18px 12px}.msg{max-width:91%;padding:12px 14px}.suggestions{padding:0 12px 10px}.suggestions button{font-size:12px;padding:8px 10px}.status{padding-left:14px}.composer{padding:10px}.send{min-width:72px;padding:0 14px}}
</style>
</head>
<body class="bot-page">
<header class="bot-header">
  <div class="brand"><div class="logo">🎓</div><div><div class="brand-title">AulaContigo</div><div class="brand-sub">Tu tutor inteligente</div></div></div>
  <button id="clear" class="clear">↻ Nueva conversación</button>
</header>
<main class="bot-main">
<section class="bot-card">
  <div class="bot-intro"><div class="eyebrow">✨ ASISTENTE EDUCATIVO</div><h1>¿Qué quieres aprender hoy?</h1><p>Haz una pregunta sobre matemáticas, ciencias, español, historia, inglés o cualquier tema escolar.</p></div>
  <div id="messages" class="messages"><div class="msg assistant">¡Hola! 👋 Soy AulaContigo. Pregúntame lo que quieras y aprenderemos juntos.</div></div>
  <div class="suggestions">
    <button data-q="Explícame las ecuaciones de primer grado">📐 Ecuaciones</button>
    <button data-q="¿Qué es la fotosíntesis?">🌱 Ciencias</button>
    <button data-q="Ayúdame con una división">➗ Matemáticas</button>
    <button data-q="¿Qué es una reseña crítica?">📚 Español</button>
  </div>
  <div id="status" class="status">Listo para ayudarte.</div>
  <form id="composer" class="composer"><textarea id="message" placeholder="Escribe tu pregunta aquí…" maxlength="2000" required></textarea><button id="send" class="send">Enviar ➤</button></form>
</section>
</main>
<script src="../js/assistant.js?v=20260919-3" defer></script>
</body>
</html>
