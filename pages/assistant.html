<style>
body{margin:0;background:#f5f7fb}.bot-page{min-height:100vh;display:flex;flex-direction:column}.bot-header{padding:18px 24px;background:#101827;color:#fff;display:flex;align-items:center;justify-content:space-between}.bot-brand{font-size:22px;font-weight:800}.bot-header span{opacity:.7;font-size:13px}.bot-main{width:min(980px,94%);margin:24px auto;flex:1;display:flex}.bot-card{width:100%;background:#fff;border-radius:22px;box-shadow:0 12px 40px #10182718;display:flex;flex-direction:column;overflow:hidden}.bot-intro{padding:25px;border-bottom:1px solid #e8ebf0}.bot-intro h1{margin:4px 0 8px;font-size:30px}.bot-intro p{margin:0;color:#667085}.messages{flex:1;min-height:55vh;max-height:62vh;overflow:auto;padding:22px}.msg{max-width:78%;padding:13px 16px;border-radius:17px;margin:10px 0;line-height:1.55;white-space:pre-wrap}.msg.user{margin-left:auto;background:#2563eb;color:white;border-bottom-right-radius:5px}.msg.assistant{background:#eef2f7;color:#172033;border-bottom-left-radius:5px}.composer{display:flex;gap:10px;padding:16px;border-top:1px solid #e8ebf0}.composer textarea{flex:1;border:1px solid #d8dee8;border-radius:14px;padding:13px;resize:none;min-height:48px;font:inherit}.send{border:0;border-radius:14px;padding:0 22px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.send:disabled{opacity:.6}.suggestions{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 14px}.suggestions button{border:1px solid #d8dee8;background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer}.typing{opacity:.65}.clear{background:transparent;border:1px solid #ffffff44;color:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}@media(max-width:600px){.bot-header{padding:15px}.messages{min-height:58vh}.msg{max-width:88%}.bot-intro h1{font-size:24px}.composer{padding:10px}.send{padding:0 16px}}
</style>

<style>
:root{--ac-bg:#eef4ff;--ac-card:#fff;--ac-ink:#172033;--ac-muted:#667085;--ac-primary:#2563eb;--ac-primary2:#1d4ed8;--ac-border:#dce3ef}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#e0ebff 0,#f5f7fb 42%,#eef2f7 100%);color:var(--ac-ink)}
.bot-page{min-height:100vh;display:flex;flex-direction:column}.bot-header{padding:16px clamp(15px,4vw,34px);background:linear-gradient(135deg,#0b1220,#172554);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:5;box-shadow:0 8px 25px #10182730}.bot-brand{font-size:21px;font-weight:850}.bot-header span{display:block;opacity:.7;font-size:12px;margin-bottom:5px}.clear{background:#ffffff12;border:1px solid #ffffff35;color:#fff;border-radius:10px;padding:8px 11px;cursor:pointer}.bot-main{width:min(1050px,94%);margin:22px auto;flex:1;display:flex}.bot-card{width:100%;background:var(--ac-card);border:1px solid #ffffffaa;border-radius:24px;box-shadow:0 18px 55px #17255418;display:flex;flex-direction:column;overflow:hidden}.bot-intro{padding:25px clamp(18px,4vw,32px);border-bottom:1px solid var(--ac-border);background:linear-gradient(180deg,#fff,#f8fbff)}.bot-intro h1{margin:3px 0 8px;font-size:clamp(24px,4vw,32px)}.bot-intro p{margin:0;color:var(--ac-muted)}.messages{flex:1;min-height:52vh;max-height:62vh;overflow:auto;padding:22px clamp(14px,4vw,28px);scroll-behavior:smooth}.msg{max-width:min(78%,720px);padding:13px 16px;border-radius:18px;margin:10px 0;line-height:1.58;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 3px 10px #17255408}.msg.user{margin-left:auto;background:linear-gradient(135deg,var(--ac-primary),var(--ac-primary2));color:#fff;border-bottom-right-radius:5px}.msg.assistant{background:#f0f4fa;color:#172033;border-bottom-left-radius:5px}.typing{opacity:.7}.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--ac-border);background:#fff}.composer textarea{flex:1;border:1px solid #cfd8e6;border-radius:15px;padding:13px 14px;resize:none;min-height:48px;max-height:150px;font:inherit;outline:none;transition:.2s}.composer textarea:focus{border-color:#6b9cff;box-shadow:0 0 0 4px #2563eb14}.send{border:0;border-radius:15px;padding:0 22px;background:linear-gradient(135deg,var(--ac-primary),var(--ac-primary2));color:#fff;font-weight:750;cursor:pointer;min-width:92px}.send:disabled{opacity:.55;cursor:not-allowed}.suggestions{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 14px}.suggestions button{border:1px solid var(--ac-border);background:#fff;color:#344054;border-radius:999px;padding:8px 12px;cursor:pointer;transition:.15s}.suggestions button:hover{border-color:#8fb1f5;background:#f5f8ff;transform:translateY(-1px)}.status{font-size:12px;color:var(--ac-muted);padding:0 22px 10px}.status.ok{color:#16803c}.status.err{color:#b42318}@media(max-width:600px){.bot-header{padding:13px 14px}.bot-header span{display:none}.bot-main{width:100%;margin:0}.bot-card{border-radius:0;border-left:0;border-right:0}.messages{min-height:58vh}.msg{max-width:90%}.bot-intro h1{font-size:24px}.composer{padding:10px}.send{padding:0 16px;min-width:78px}.suggestions{padding:0 12px 10px}.status{padding:0 12px 8px}}
</style></head>
<body class="bot-page">
<header class="bot-header"><div class="bot-brand">🎓 AulaContigo</div><div><span>Tutor educativo</span> <button id="clear" class="clear">Nueva conversación</button></div></header>
<main class="bot-main"><section class="bot-card">
<div class="bot-intro"><h1>🤖 ¿Qué quieres aprender hoy?</h1><p>Pregúntame sobre matemáticas, ciencias, español, historia, inglés o cualquier tema escolar.</p></div>
<div id="messages" class="messages"><div class="msg assistant">¡Hola! 👋 Soy AulaContigo. Escribe tu pregunta y te explicaré la respuesta paso a paso.</div></div>
<div class="suggestions"><button data-q="Explícame las ecuaciones de primer grado">📐 Ecuaciones</button><button data-q="¿Qué es la fotosíntesis?">🌱 Ciencias</button><button data-q="Ayúdame con una división">➗ Matemáticas</button><button data-q="¿Qué es una reseña crítica?">📚 Español</button></div>
<div id="status" class="status">Listo para ayudarte.</div><form id="composer" class="composer"><textarea id="message" placeholder="Escribe tu pregunta…" maxlength="2000" required></textarea><button id="send" class="send">Enviar</button></form>
</section></main>
<script src="../js/assistant.js?v=20260919-2" defer></script>
</body></html>
