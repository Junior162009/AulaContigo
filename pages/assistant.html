<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asistente IA | AulaContigo</title><link rel="stylesheet" href="../css/style.css"><style>.ai-shell{display:grid;grid-template-columns:250px 1fr;gap:18px;min-height:70vh}.ai-sidebar{display:flex;flex-direction:column;gap:10px}.ai-list{display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:55vh}.ai-conv{border:0;background:transparent;text-align:left;padding:10px;border-radius:10px;cursor:pointer}.ai-conv:hover,.ai-conv.active{background:#eef5ff}.chat{display:flex;flex-direction:column;min-height:70vh}.messages{flex:1;overflow:auto;padding:8px}.msg{max-width:82%;padding:12px 15px;border-radius:16px;margin:8px 0;white-space:pre-wrap;line-height:1.5}.msg.user{margin-left:auto;background:#0b6efd;color:white;border-bottom-right-radius:5px}.msg.assistant{background:#f1f4f8;border-bottom-left-radius:5px}.composer{display:flex;gap:10px;align-items:end;border-top:1px solid #e5e7eb;padding-top:14px}.composer textarea{flex:1;min-height:55px;resize:vertical}.ai-status{min-height:24px}.thinking{opacity:.7}@media(max-width:800px){.ai-shell{grid-template-columns:1fr}.ai-sidebar{order:2}.ai-list{max-height:180px}.chat{min-height:65vh}.msg{max-width:92%}}</style></head><body><header class="topbar"><a class="brand" href="../">🎓 AulaContigo</a><div class="actions"><a class="btn btn-outline" href="student-dashboard.html">Panel</a><button id="logout" class="btn btn-outline">Salir</button></div></header><main class="container page"><div class="ai-shell"><aside class="panel ai-sidebar"><strong>🤖 Mis conversaciones</strong><button id="new-chat" class="btn">Nueva conversación</button><button id="clear-chat" class="btn btn-soft">Limpiar conversación</button><div id="conversation-list" class="ai-list"></div></aside><section class="panel chat"><div><span class="eyebrow">Tutor educativo</span><h1>¿Qué quieres aprender hoy?</h1><p class="muted">Pregúntame y trabajamos el problema paso a paso.</p></div><div id="messages" class="messages" aria-live="polite"><div class="msg assistant">¡Hola! Soy el asistente de AulaContigo. Escríbeme una duda académica y la resolveremos paso a paso.</div></div><div id="ai-status" class="ai-status muted" aria-live="polite"></div><form id="composer" class="composer"><textarea id="message" maxlength="4000" placeholder="Escribe tu pregunta…" required></textarea><button id="send" class="btn" type="submit">Enviar</button></form><small id="counter" class="muted">0 / 4000</small></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script src="../js/assistant.js"></script></body></html>
