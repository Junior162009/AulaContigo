<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta | AulaContigo</title><link rel="stylesheet" href="../css/style.css"></head><body class="auth-page"><main class="auth-layout"><section class="auth-brand"><a class="brand light" href="../">🎓 AulaContigo</a><div><span class="eyebrow light-text">ÚNETE A AULACONTIGO</span><h1>Tu aprendizaje, en un solo lugar.</h1><p>Crea tu cuenta con tu correo y una contraseña. Las cuentas nuevas comienzan como estudiantes.</p></div></section><section class="auth-card"><div class="auth-card-head"><span class="auth-icon">✨</span><div><h2>Crear cuenta</h2><p>Regístrate en menos de un minuto</p></div></div><form id="register-form"><label for="name">Nombre completo</label><input id="name" type="text" autocomplete="name" placeholder="Tu nombre" minlength="2" maxlength="100" required><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" placeholder="tu@correo.com" required><label for="password">Contraseña</label><div class="password-wrap"><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="Mínimo 8 caracteres" required><button type="button" id="toggle-password" class="eye">👁️</button></div><button id="register-button" class="btn btn-primary btn-full" type="submit">Crear cuenta</button></form><p id="register-status" class="form-status" aria-live="polite"></p><div class="auth-links"><a href="login.html">Ya tengo cuenta</a></div><a class="back-home" href="../">← Volver al inicio</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase.js"></script><script src="../js/register.js"></script></body></html>
